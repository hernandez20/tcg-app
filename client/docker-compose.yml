
services:
  client:
    image: node:20
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app 
    ports:
      - "3000:3000"
    command: npm run dev
    environment:
      - NODE_ENV=development
    networks:
      - tcg_network 
networks:
  tcg_network:  # Updated to use the new network name
    external: true